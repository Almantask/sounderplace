name = "sunderplace"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://127.0.0.1:5173"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ACTION_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "sunderplace"
database_id = "local-sunderplace"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "sunderplace-audio"
